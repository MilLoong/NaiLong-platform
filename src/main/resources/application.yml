spring:
  application:
    name: NaiLong-platform

  # 数据源配置（敏感项请用环境变量或 application-local.yml）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/nailong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:nailong}
    password: ${DB_PASSWORD:changeme}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: NaiLongHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: "${REDIS_PASSWORD:changeme}"
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# Redisson 配置
redisson:
  address: "redis://127.0.0.1:6379"
  password: "${REDIS_PASSWORD:changeme}"
  database: 0

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.nailong: DEBUG

# 自定义配置
nailong:
  security:
    # 是否开放 Knife4j/Swagger（生产请关闭）
    api-docs-enabled: true

  cors:
    allowed-origins: "*"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: false
    max-age: 3600

  # 分数配置
  score:
    decay-rate: 0.01  # 分数衰减率
    min-score: 10     # 最低分数
  
  # 排行榜配置
  rank:
    cache-expire: 3600 # 排行榜缓存过期时间(秒)
    page-size: 20      # 分页大小
  
  # 验证码配置
  code:
    expire: 300        # 验证码过期时间(秒)
  
  # JWT配置（过期时间为秒；密钥请用环境变量或 local profile）
  jwt:
    secret: ${JWT_SECRET:dev_only_change_me_use_application_local_yml}
    access-token-expire: 86400   # 24小时
    refresh-token-expire: 604800 # 7天
    issuer: NaiLong-platform