<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册验证码</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 20px 0;
        }
        .content p {
            margin-bottom: 15px;
        }
        .verification-code {
            background-color: #f8f9fa;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            margin: 20px 0;
        }
        .verification-code span {
            font-size: 28px;
            font-weight: bold;
            color: #3498db;
            letter-spacing: 3px;
        }
        .note {
            background-color: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #ff9800;
            border-radius: 4px;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
            font-size: 14px;
        }
        .footer p {
            margin: 5px 0;
        }
        @media (max-width: 640px) {
            .container {
                margin: 10px;
                padding: 15px;
            }
            .verification-code span {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>欢迎注册</h1>
        </div>
        <div class="content">
            <p>尊敬的用户：</p>
            <p>感谢您选择林锐招聘平台。为了完成注册，请使用以下验证码：</p>
            <div class="verification-code">
                <span>${code}</span>
            </div>
            <p>此验证码有效期为15分钟，请尽快完成注册流程。</p>
            <div class="note">
                <p><strong>注意：</strong>如果您没有请求此验证码，请忽略本邮件，您的账户安全不会受到影响。</p>
            </div>
        </div>
        <div class="footer">
            <p>林锐招聘平台</p>
            <p>&copy; ${year} 林锐招聘. 保留所有权利.</p>
        </div>
    </div>
</body>
</html>
