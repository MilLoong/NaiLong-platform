<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 20px 0;
        }
        .content p {
            margin-bottom: 15px;
        }
        .reset-link {
            text-align: center;
            margin: 25px 0;
        }
        .reset-link a {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .reset-link a:hover {
            background-color: #2980b9;
        }
        .verification-code {
            background-color: #f8f9fa;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            margin: 20px 0;
        }
        .verification-code span {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            letter-spacing: 3px;
        }
        .note {
            background-color: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #ff9800;
            border-radius: 4px;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
            font-size: 14px;
        }
        .footer p {
            margin: 5px 0;
        }
        @media (max-width: 640px) {
            .container {
                margin: 10px;
                padding: 15px;
            }
            .reset-link a {
                width: 100%;
                box-sizing: border-box;
            }
            .verification-code span {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>重置密码</h1>
        </div>
        <div class="content">
            <p>尊敬的用户：</p>
            <p>我们收到了您重置林锐招聘平台账户密码的请求。请点击下方按钮或使用验证码来重置您的密码：</p>
            
            <!-- 重置链接 - 优先方式 -->
            <div class="reset-link">
                <a href="${resetUrl}">立即重置密码</a>
            </div>
            
            <!-- 备用验证码方式 -->
            <p>如果上方按钮无法点击，请使用以下验证码进行重置：</p>
            <div class="verification-code">
                <span>${code}</span>
            </div>
            
            <p>此重置链接和验证码有效期为30分钟，请尽快完成密码重置。</p>
            
            <div class="note">
                <p><strong>重要提示：</strong></p>
                <p>• 如果您没有请求重置密码，请忽略本邮件，您的账户安全不会受到影响。</p>
                <p>• 为了您的账户安全，请勿向任何人透露您的验证码或点击未知链接。</p>
                <p>• 如遇任何问题，请联系我们的客服团队：support@nailong.com</p>
            </div>
        </div>
        <div class="footer">
            <p>林锐招聘平台</p>
            <p>&copy; ${year} 林锐招聘. 保留所有权利.</p>
        </div>
    </div>
</body>
</html>
